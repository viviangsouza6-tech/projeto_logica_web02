<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJETO DESAFIO WEB</title>

<body>
     <h1> 3. O usuário deverá informar:
        ● A distância a ser percorrida (em quilômetros);
        ● O consumo médio do veículo (em km/l);
        ● O preço do litro do combustível.</h1>

    <div id="div-form">
        <h3> A quantidade de combustível necessário para percorrer
            o trajeto.</h3>
        <h3> O valor total a pagar com combustível para esse
            deslocamento.</h3>
        
    <form id="formulario">
            <label for="distancia">Distância (em km)</label>
            <input type="text" name="distancia" id="distancia">

            <label for="consumo">Consumo médio</label>
            <input type="text" name="consumo" id="consumo">

            <label for="precoCombustivel">Preço p/litro do combsutível</label>
            <input type="text" name = "precoCombustivel" id="precoCombustivel"> 

            <button type="submit"> Enviar </button>
            <button type="reset"> Limpar </button>
        </form>

        <div id="div-dados"></div>

    </div>

</body>

</html
